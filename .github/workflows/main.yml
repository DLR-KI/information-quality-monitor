name: Tests

on:
  - push
  - pull_request
  - workflow_dispatch

env:
  # Python
  PYTHON_VERSION: "3.10"
  # Caching
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  PREK_HOME: ${{ github.workspace }}/.cache/prek
  # PyTorch CPU
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
  UV_EXTRA_INDEX_URL: pytorch=https://download.pytorch.org/whl/cpu

jobs:

  # ##  PRE BUILD  ##############################################################

  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: j178/prek-action@v2

  # ##  BUILD PROJECT AND CACHE  ################################################

  build:
    name: Build and cache project
    runs-on: ubuntu-latest
    needs: [pre-commit]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "${{ env.PYTHON_VERSION }}"
      - name: Install dependencies
        run: uv sync --all-groups

  # ##  LINTER AND STATIC CHECKS  ###############################################

  ruff-lint:
    name: Ruff linter
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "${{ env.PYTHON_VERSION }}"
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Test source code
        run: uv run ruff check src
      - name: Test test code
        run: uv run ruff check tests
      - name: Test test scripts
        run: |
          if [[ -n $(find scripts -name "*.py[i]" -print -quit) ]]; then
            uv run ruff check scripts
          fi

  ruff-format:
    name: Ruff formatter
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "${{ env.PYTHON_VERSION }}"
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Test source code
        run: uv run ruff format --diff src
      - name: Test test code
        run: uv run ruff format --diff tests
      - name: Test test scripts
        run: |
          if [[ -n $(find scripts -name "*.py[i]" -print -quit) ]]; then
            uv run ruff format --diff scripts
          fi

  mdlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Add special markdownlint rules
        run: |
          echo '{"config":{"MD013": false}}' > .markdownlint-cli2.jsonc
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: |
            README.md
            docs/**/*.md

  licensecheck:
    name: License checks
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "${{ env.PYTHON_VERSION }}"
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Check licenses
        run: uv run licensecheck

  reuse:
    name: Reuse check
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "${{ env.PYTHON_VERSION }}"
      - name: Check reuse information
        run: uv tool run reuse lint

  # ##  TESTS  ##################################################################

  pytest:
    name: Run Python Unit Tests
    runs-on: ubuntu-latest
    # only run Python tests if linting was successful
    needs:
      - build
      - ruff-lint
      - ruff-format
      - mdlint
      - licensecheck
      - reuse
    strategy:
      matrix:
        python-version: ["3.10"]  # fix for only this version
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Test with pytest
        run: uv run coverage run -m pytest
