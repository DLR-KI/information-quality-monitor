version: 2
updates:
  # Maintain dependencies for Python packages
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0  # prevents normal PRs, allows security PRs
    assignees:
      - Yannick-Kees
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "torch"
        versions: ["2.7.1+cu118"]

  # Maintain dependencies inside uv lock file
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    assignees:
      - Yannick-Kees
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "torch"
        versions: ["2.7.1+cu118"]

  # Maintain dependencies for GitHub actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    assignees:
      - Yannick-Kees
    cooldown:
      default-days: 7

  # Maintain dependencies for pre-commit config
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    assignees:
      - Yannick-Kees
    cooldown:
      default-days: 7
